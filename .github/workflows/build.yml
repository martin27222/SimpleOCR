name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Set up the release key
        # Repository secrets; without them the release APK stays unsigned.
        env:
          KEYSTORE_BASE64: ${{ secrets.SIMPLEOCR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIMPLEOCR_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "No release key configured."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          {
            echo "simpleocr.release.storeFile=$RUNNER_TEMP/release.p12"
            echo "simpleocr.release.storePassword=$KEYSTORE_PASSWORD"
            echo "simpleocr.release.keyAlias=simpleocr"
            echo "simpleocr.release.keyPassword=$KEYSTORE_PASSWORD"
          } >> local.properties

      - name: Test and build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon test assembleDebug assembleRelease

      - name: Name the APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SimpleOCR-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/SimpleOCR.apk
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: SimpleOCR-debug-apk
          path: dist/SimpleOCR-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: SimpleOCR-apk
          path: dist/SimpleOCR.apk
          if-no-files-found: ignore

  publish-dev-build:
    # Every build of main becomes the latest release, so the APK has a fixed download link
    # (releases/latest/download/SimpleOCR.apk) and Obtainium sees each build as an update.
    # Only APKs signed with the release key are published; without the key this job fails.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: SimpleOCR-apk
          path: dist

      - name: Publish the release and keep the three newest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: 0.1.${{ github.run_number }}
        run: |
          gh release create "v$VERSION" dist/SimpleOCR.apk \
            --latest \
            --target "$GITHUB_SHA" \
            --title "SimpleOCR $VERSION" \
            --notes "Development build from commit $GITHUB_SHA. Changes: see CHANGELOG.md."
          gh release delete dev-latest --cleanup-tag --yes || true
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'map(select(.tagName | startswith("v0.1."))) | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
            | xargs -r -n1 gh release delete --cleanup-tag --yes
