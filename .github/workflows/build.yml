name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Test and build the debug APK
        run: ./gradlew --no-daemon test assembleDebug assembleRelease

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SimpleOCR-debug.apk

      - uses: actions/upload-artifact@v6
        with:
          name: SimpleOCR-debug-apk
          path: dist/SimpleOCR-debug.apk
          if-no-files-found: error

  publish-dev-build:
    # Keeps one always-current prerelease so the APK has a direct download link.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: SimpleOCR-debug-apk
          path: dist

      - name: Replace the dev-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete dev-latest --cleanup-tag --yes || true
          gh release create dev-latest dist/SimpleOCR-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Development build" \
            --notes "Debug APK built from commit $GITHUB_SHA. Signed with the public debug key, for testing only."
