name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Test and build the debug APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon test assembleDebug assembleRelease

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SimpleOCR.apk

      - uses: actions/upload-artifact@v6
        with:
          name: SimpleOCR-debug-apk
          path: dist/SimpleOCR.apk
          if-no-files-found: error

  publish-dev-build:
    # Every build of main becomes the latest release, so the APK has a fixed download link
    # (releases/latest/download/SimpleOCR.apk) and Obtainium sees each build as an update.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: SimpleOCR-debug-apk
          path: dist

      - name: Publish the release and keep the three newest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: 0.1.${{ github.run_number }}
        run: |
          gh release create "v$VERSION" dist/SimpleOCR.apk \
            --latest \
            --target "$GITHUB_SHA" \
            --title "SimpleOCR $VERSION" \
            --notes "Development build from commit $GITHUB_SHA. Signed with the public debug key, for testing only. Changes: see CHANGELOG.md."
          gh release delete dev-latest --cleanup-tag --yes || true
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'map(select(.tagName | startswith("v0.1."))) | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
            | xargs -r -n1 gh release delete --cleanup-tag --yes
